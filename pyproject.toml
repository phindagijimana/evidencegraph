[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencegraph"
version = "0.1.0"
description = "Binding and scoring protocol for published claims."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evidencegraph = "evidencegraph.cli:main"

[tool.setuptools.packages.find]
include = ["evidencegraph*", "ingest*", "graph*", "evaluation*", "baselines*", "extraction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
